<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tremor meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e9efed; --field:#f6f9f8; --grid:#cfdbd7; --grid-strong:#a9bbb6;
  --ink:#1d2742; --muted:#55656e; --pen:#c3352b; --warn-bg:#fbe7d8; --warn:#7f3410;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#101a1c; --field:#172427; --grid:#213236; --grid-strong:#35494d;
  --ink:#e3ecea; --muted:#94a7ac; --pen:#ff6f62; --warn-bg:#3b2519; --warn:#ffcaa9; } }
:root[data-theme="dark"]{
  --paper:#101a1c; --field:#172427; --grid:#213236; --grid-strong:#35494d;
  --ink:#e3ecea; --muted:#94a7ac; --pen:#ff6f62; --warn-bg:#3b2519; --warn:#ffcaa9; }
*,*::before,*::after{ box-sizing:inherit; }
[hidden]{ display:none !important; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--paper); color:var(--ink);
  font-family:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:18px; line-height:1.5; -webkit-font-smoothing:antialiased; }
main{ max-width:560px; margin:0 auto; padding:12px 20px 56px; }
.topbar{ display:flex; justify-content:flex-end; margin:0 0 8px; }
.lang{ display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:6px 14px; font:inherit; font-size:15px; font-weight:700;
  border-radius:999px; border:2px solid var(--grid-strong); background:var(--field); color:var(--ink); cursor:pointer; }
.lang svg{ width:18px; height:18px; flex:none; }
h1{ font-size:36px; line-height:1.05; margin:0 0 6px; font-weight:700; letter-spacing:-.015em; }
h2{ font-size:22px; margin:40px 0 12px; }
.lede{ color:var(--muted); margin:0 0 28px; max-width:34em; }
fieldset{ border:0; padding:0; margin:0 0 22px; min-width:0; }
legend{ font-weight:700; font-size:17px; margin-bottom:8px; padding:0; }
.seg{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:8px; }
.seg button{ min-height:58px; font:inherit; font-size:17px; border-radius:14px; border:2px solid var(--grid-strong);
  background:var(--field); color:var(--ink); cursor:pointer; padding:8px 6px; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); font-weight:700; }
.seg button:disabled{ opacity:.38; cursor:not-allowed; }
.note{ font-size:15px; color:var(--muted); margin:8px 0 0; }
.howto{ background:var(--field); border-inline-start:5px solid var(--ink); padding:14px 16px; border-radius:12px; border-start-start-radius:0; border-end-start-radius:0; margin:6px 0 24px; }
.howto strong{ display:block; margin-bottom:4px; }
button{ -webkit-tap-highlight-color:transparent; }
.primary{ width:100%; min-height:66px; font:inherit; font-size:21px; font-weight:700; border:0; border-radius:16px;
  background:var(--pen); color:#fff; cursor:pointer; }
.secondary{ width:100%; min-height:58px; font:inherit; font-size:18px; border-radius:16px; border:2px solid var(--grid-strong);
  background:transparent; color:var(--ink); cursor:pointer; }
button:focus-visible{ outline:3px solid var(--pen); outline-offset:3px; }
.stack{ display:grid; gap:10px; margin-top:24px; }
.error{ background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:14px 16px; margin:0 0 20px; }
.warn{ background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:12px 16px; margin:16px 0 0; font-size:16px; }
.warn p{ margin:0; } .warn p + p{ margin-top:8px; }

/* recording */
.rec-status{ font-size:20px; font-weight:700; margin:8px 0 4px; min-height:1.5em; }
.count{ font-size:112px; font-weight:700; line-height:1; margin:8px 0 16px; font-variant-numeric:tabular-nums; }
.chart{ width:100%; display:block; border-radius:12px; background:var(--field); }
.strip{ height:200px; }
.camview{ width:100%; max-height:46vh; object-fit:contain; border-radius:12px; background:#000; display:block; margin:0 0 12px; }

/* result */
.res-head{ font-size:20px; font-weight:700; margin:0; }
.res-freq{ font-size:88px; line-height:1; font-weight:700; margin:6px 0 4px; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.res-freq small{ font-size:32px; font-weight:400; letter-spacing:0; margin-inline-start:6px; }
[dir=rtl] .res-freq{ direction:ltr; text-align:right; }
.res-freq.faint{ color:var(--muted); }
.res-sub{ color:var(--muted); margin:0 0 18px; }
.spectrum{ height:210px; }
.details{ margin:18px 0 0; display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:16px; }
.details dt{ color:var(--muted); }
.details dd{ margin:0; }

/* history */
.hist{ list-style:none; margin:0; padding:0; }
.hist li{ padding:12px 0; border-top:1px solid var(--grid); }
.hist .when{ font-size:14px; color:var(--muted); }
.hist .what{ font-weight:700; }
.hist .how{ font-size:15px; color:var(--muted); }
.link{ font:inherit; font-size:15px; background:none; border:0; color:var(--muted); text-decoration:underline; padding:10px 0; cursor:pointer; }
.disclaimer{ font-size:14px; color:var(--muted); margin-top:40px; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <button class="lang" id="langBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.8 3.9 6 3.9 9.5s-1.3 6.7-3.9 9.5c-2.6-2.8-3.9-6-3.9-9.5s1.3-6.7 3.9-9.5z"/></svg><span id="langLabel">עב</span></button>
  </div>
  <section id="setup">
    <h1 data-i18n="title">Tremor meter</h1>
    <p class="lede" data-i18n="lede">Measures how fast a hand or leg shakes, from your phone's motion sensor or its camera.</p>
    <div id="setupError" class="error" role="alert" hidden></div>

    <fieldset>
      <legend data-i18n="measureWith">Measure with</legend>
      <div class="seg" data-key="sensor">
        <button type="button" data-v="motion" data-i18n="segMotion">Motion sensor</button>
        <button type="button" data-v="camera" data-i18n="segCamera">Camera</button>
      </div>
      <p class="note" id="sensorNote"></p>
    </fieldset>
    <fieldset>
      <legend data-i18n="bodyPart">Body part</legend>
      <div class="seg" data-key="limb">
        <button type="button" data-v="hand" data-i18n="segHand">Hand</button>
        <button type="button" data-v="leg" data-i18n="segLeg">Leg</button>
      </div>
    </fieldset>
    <fieldset>
      <legend data-i18n="position">Position</legend>
      <div class="seg" data-key="posture">
        <button type="button" data-v="rest" data-i18n="segRest">At rest</button>
        <button type="button" data-v="hold" data-i18n="segHold">Held out</button>
        <button type="button" data-v="stand" data-i18n="segStand">Standing</button>
      </div>
    </fieldset>

    <div class="howto" id="howto"></div>
    <button class="primary" id="startBtn" type="button" data-i18n="start">Start measuring</button>
  </section>

  <section id="record" hidden aria-live="polite">
    <p class="rec-status" id="recStatus">Get ready</p>
    <div class="count" id="count"></div>
    <canvas class="camview" id="camView" hidden aria-label="Camera view with hand points" data-i18n-aria="ariaCam"></canvas>
    <canvas class="chart strip" id="strip" aria-label="Live movement trace" data-i18n-aria="ariaStrip"></canvas>
    <p class="note" id="recNote"></p>
    <div class="stack"><button class="secondary" id="cancelBtn" type="button" data-i18n="cancel">Cancel</button></div>
  </section>

  <section id="result" hidden>
    <p class="res-head" id="resHead"></p>
    <p class="res-freq" id="resFreq"></p>
    <p class="res-sub" id="resSub"></p>
    <canvas class="chart spectrum" id="spectrum" aria-label="Frequency spectrum of the movement" data-i18n-aria="ariaSpectrum"></canvas>
    <dl class="details" id="resDetails"></dl>
    <div class="warn" id="resWarn" hidden></div>
    <div class="stack">
      <button class="primary" id="againBtn" type="button" data-i18n="again">Measure again</button>
      <button class="secondary" id="setupBtn" type="button" data-i18n="changeSetup">Change setup</button>
    </div>
  </section>

  <section id="historyWrap" hidden>
    <h2 data-i18n="pastTitle">Past measurements</h2>
    <ol class="hist" id="histList"></ol>
    <button class="link" id="clearHist" type="button" data-i18n="clearHist">Clear history</button>
  </section>

  <p class="disclaimer" data-i18n="disclaimer">Not a medical device. The numbers are for comparing the same person over time with the same setup, not for diagnosis.</p>
</main>

  const ampIdx = ampChannels || psds.map((_, i) => i);
  psds.forEach((p, c) => { for (let k = 0; k < K; k++) { all[k] += p[k]; if (ampIdx.includes(c)) amp[k] += p[k]; } });
  const lo = CONFIG.BAND_LO, hi = Math.min(CONFIG.BAND_HI, nyq - 0.5);
  if (hi <= lo + 1) return Object.assign(aErr('errRate', { fs: fs.toFixed(0) }), { fs, nyq, dur });
  const kLo = Math.ceil(lo / df), kHi = Math.floor(hi / df);
  let kp = kLo; for (let k = kLo; k <= kHi; k++) if (all[k] > all[kp]) kp = k;
  let f0 = kp * df; // parabolic refinement of the peak
  if (kp > kLo && kp < kHi) {
    const a = all[kp - 1], b = all[kp], c = all[kp + 1], d = a - 2 * b + c;
    if (d < 0) f0 = (kp + 0.5 * (a - c) / d) * df;
  }
  const band = Array.from(all.slice(kLo, kHi + 1));
  const ratio = all[kp] / (median(band) || 1e-12);
  const strength = ratio >= CONFIG.STRONG_RATIO ? 'clear' : ratio >= CONFIG.WEAK_RATIO ? 'weak' : 'none';
  let pw = 0; for (let k = Math.max(0, Math.round((f0 - 1) / df)); k <= Math.min(K - 1, Math.round((f0 + 1) / df)); k++) pw += amp[k] * df;
  const rms = Math.sqrt(pw);
  const pp = unit === 'accel' ? 2 * Math.SQRT2 * rms / Math.pow(2 * Math.PI * f0, 2) * 1000 : 2 * Math.SQRT2 * rms; // mm, peak to peak
  const freqs = Array.from({ length: K }, (_, k) => k * df);
  const edge = kp === kLo || kp === kHi;
  // trace for display: strongest channel, detrended
  let best = 0, bv = -1; chans.forEach((x, i) => { let v = 0; for (const s of x) v += s * s; if (v > bv) { bv = v; best = i; } });
  return { fs, nyq, dur, n, f0, ratio, strength, rms, pp, unit, freqs, psd: Array.from(all), band: [lo, hi], edge, trace: Array.from(chans[best]) };
}

/* ---------------- result ---------------- */
function fmtMM(x) { return x >= 10 ? x.toFixed(0) : x >= 1 ? x.toFixed(1) : x >= 0.1 ? x.toFixed(2) : x.toFixed(3); }
function renderResult(res, keep) { // keep: re-render in place (language change), no scroll
  if (!keep) show('result');
  const L = LABEL();
  $('resSub').textContent = t('sub', { limb: L.limb[res.limb], posture: L.posture[res.posture], sensor: L.sensor[res.sensor] });
  const dl = $('resDetails'); dl.innerHTML = '';
  const row = (k, v) => { const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = k; dd.textContent = v; dl.append(dt, dd); };
  const warns = [];
  if (res.error) {
    $('resHead').textContent = t('noResult');
    $('resFreq').textContent = '\u2013'; $('resFreq').className = 'res-freq faint';
    warns.push(res.errKey ? t(...res.errKey) : res.error);
    $('spectrum').hidden = true;
  } else {
    $('spectrum').hidden = false;
    $('resHead').textContent = t(res.strength);
    $('resFreq').innerHTML = '';
    $('resFreq').append(document.createTextNode(res.f0.toFixed(1)));
    const sm = document.createElement('small'); sm.textContent = t('hz'); $('resFreq').append(sm);
    $('resFreq').className = 'res-freq' + (res.strength === 'none' ? ' faint' : '');
    if (res.strength === 'none') $('resHead').textContent = t('noneAt');
    row(t('dFreq'), t('vFreq', { f: res.f0.toFixed(1) }));
    row(t('dSize'), t(res.sensor === 'camera' ? 'vSizeCam' : 'vSize', { mm: fmtMM(res.pp) }));
    if (res.sensor === 'motion') row(t('dAccel'), t('vAccel', { a: res.rms.toFixed(3) }));
    row(t('dRatio'), t('vRatio', { r: res.ratio > 100 ? t('over100') : res.ratio.toFixed(1) }));
    row(t('dRate'), t('vRate', { fs: res.fs.toFixed(0), nyq: res.nyq.toFixed(0) }));
    row(t('dRec'), t('vRec', { d: res.dur.toFixed(1), n: res.n }));
    if (res.sensor === 'camera') row(t('dTracker'), t('vTracker', { d: res.delegate || '-', p: Math.round((res.handPct || 0) * 100) }));
    if (res.posture === 'stand' && res.nyq < 18) warns.push(t('wStand', { fs: res.fs.toFixed(0) }));
    else if (res.nyq < 12) warns.push(t('wLowRate', { nyq: res.nyq.toFixed(0) }));
    if (res.strength !== 'none' && res.pp < 0.1) warns.push(t('wTiny'));
    if (res.edge && res.strength !== 'none') warns.push(t('wEdge'));
    if (res.sensor === 'camera' && res.handPct < 0.8) warns.push(t('wLost', { p: Math.round((1 - res.handPct) * 100) }));
    if (res.dur < res.plannedS * 0.8) warns.push(t('wShort', { d: res.dur.toFixed(1) }));
    requestAnimationFrame(() => drawSpectrum(res));
  }
  $('resWarn').innerHTML = '';
  warns.forEach((w) => { const p = document.createElement('p'); p.textContent = w; $('resWarn').append(p); });
  $('resWarn').hidden = !warns.length;
  renderHistory();
}
function drawSpectrum(res) {
  const { c, w, h } = sizeCanvas($('spectrum'));
  const xmax = Math.min(25, res.nyq), pad = { l: 8, r: 8, t: 14, b: 26 };
  const X = (f) => pad.l + f / xmax * (w - pad.l - pad.r), plotH = h - pad.t - pad.b;
  paperGrid(c, w, h, 1e9, 1e9);
  c.strokeStyle = cssVar('--grid'); c.lineWidth = 1; c.beginPath();
  for (let f = 0; f <= xmax; f += 1) { const x = Math.round(X(f)) + 0.5; c.moveTo(x, pad.t); c.lineTo(x, h - pad.b); }
  c.stroke();
  c.fillStyle = cssVar('--muted'); c.font = '13px "Atkinson Hyperlegible", system-ui, sans-serif'; c.textAlign = 'center';
  for (let f = 0; f <= xmax; f += 5) c.fillText(f + ' ' + t('hz'), Math.min(w - 22, Math.max(18, X(f))), h - 8);
  // outside the search band: shaded
  c.fillStyle = cssVar('--grid'); c.globalAlpha = 0.45;
  c.fillRect(X(0), pad.t, X(res.band[0]) - X(0), plotH);
  if (res.band[1] < xmax) c.fillRect(X(res.band[1]), pad.t, X(xmax) - X(res.band[1]), plotH);
  c.globalAlpha = 1;
  let top = 1e-12; res.freqs.forEach((f, k) => { if (f >= res.band[0] && f <= res.band[1]) top = Math.max(top, res.psd[k]); });
  const Y = (p) => h - pad.b - Math.min(1.05, p / top) * plotH * 0.9;
  c.beginPath(); c.moveTo(X(0), h - pad.b);
  res.freqs.forEach((f, k) => { if (f <= xmax) c.lineTo(X(f), Y(res.psd[k])); });
  c.lineTo(X(Math.min(xmax, res.freqs[res.freqs.length - 1])), h - pad.b); c.closePath();
  c.fillStyle = cssVar('--ink'); c.globalAlpha = 0.14; c.fill(); c.globalAlpha = 1;
  c.beginPath(); res.freqs.forEach((f, k) => { if (f <= xmax) (k ? c.lineTo(X(f), Y(res.psd[k])) : c.moveTo(X(f), Y(res.psd[k]))); });
  c.strokeStyle = cssVar('--ink'); c.lineWidth = 1.8; c.stroke();
  const px = X(res.f0);
  c.strokeStyle = cssVar('--pen'); c.lineWidth = 2; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(px, pad.t); c.lineTo(px, h - pad.b); c.stroke(); c.setLineDash([]);
  c.fillStyle = cssVar('--pen'); c.textAlign = px > w - 70 ? 'right' : 'left'; c.font = '700 14px "Atkinson Hyperlegible", system-ui, sans-serif';
  c.fillText(res.f0.toFixed(1) + ' ' + t('hz'), px + (px > w - 70 ? -6 : 6), pad.t + 4);
}

/* ---------------- history ---------------- */
const HKEY = 'tremor.history.v1';
function loadHistory() { try { return JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch { return []; } }
function saveHistory(res) {
  const h = loadHistory();
  h.unshift({ ts: Date.now(), sensor: res.sensor, limb: res.limb, posture: res.posture, f: +res.f0.toFixed(2), strength: res.strength, pp: +res.pp.toPrecision(3), fs: Math.round(res.fs) });
  try { localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 50))); } catch {}
}
function renderHistory() {
  const h = loadHistory(), ol = $('histList'); ol.innerHTML = '';
  $('historyWrap').hidden = !h.length || !$('record').hidden;
  const fmt = new Intl.DateTimeFormat(lang === 'he' ? 'he-IL' : undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  for (const e of h.slice(0, 20)) {
    const li = document.createElement('li');
    const when = document.createElement('div'); when.className = 'when'; when.textContent = fmt.format(new Date(e.ts));
    const what = document.createElement('div'); what.className = 'what';
    what.textContent = t('hWhat', { f: e.f.toFixed(1), s: t(e.strength === 'clear' ? 'hClear' : e.strength === 'weak' ? 'hWeak' : 'hNone') });
    const how = document.createElement('div'); how.className = 'how';
    const L = LABEL(); how.textContent = t('hHow', { limb: L.limb[e.limb], posture: L.posture[e.posture], sensor: L.sensor[e.sensor], mm: fmtMM(e.pp) });
    li.append(when, what, how); ol.append(li);
  }
}

/* ---------------- wiring ---------------- */
let lastResult = null;
$('startBtn').addEventListener('click', start);
$('cancelBtn').addEventListener('click', cancel);
$('againBtn').addEventListener('click', start);
$('setupBtn').addEventListener('click', () => { show('setup'); renderHistory(); });
$('clearHist').addEventListener('click', () => { try { localStorage.removeItem(HKEY); } catch {} renderHistory(); });
window.addEventListener('resize', () => { if (!$('result').hidden && lastResult && !lastResult.error) drawSpectrum(lastResult); });
$('langBtn').addEventListener('click', () => setLang(lang === 'he' ? 'en' : 'he'));
applyLang();

// Test hook: lets automated tests feed samples and run the analysis without real sensors.
window.__tremor = { CONFIG, state, analyze, addMotion, get rec() { return rec; }, get last() { return lastResult; }, get lang() { return lang; }, setLang };
</script>
