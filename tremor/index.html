<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tremor meter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e9efed; --field:#f6f9f8; --grid:#cfdbd7; --grid-strong:#a9bbb6;
  --ink:#1d2742; --muted:#55656e; --pen:#c3352b; --warn-bg:#fbe7d8; --warn:#7f3410;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#101a1c; --field:#172427; --grid:#213236; --grid-strong:#35494d;
  --ink:#e3ecea; --muted:#94a7ac; --pen:#ff6f62; --warn-bg:#3b2519; --warn:#ffcaa9; } }
:root[data-theme="dark"]{
  --paper:#101a1c; --field:#172427; --grid:#213236; --grid-strong:#35494d;
  --ink:#e3ecea; --muted:#94a7ac; --pen:#ff6f62; --warn-bg:#3b2519; --warn:#ffcaa9; }
*,*::before,*::after{ box-sizing:inherit; }
[hidden]{ display:none !important; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--paper); color:var(--ink);
  font-family:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:18px; line-height:1.5; -webkit-font-smoothing:antialiased; }
main{ max-width:560px; margin:0 auto; padding:28px 20px 56px; }
h1{ font-size:36px; line-height:1.05; margin:0 0 6px; font-weight:700; letter-spacing:-.015em; }
h2{ font-size:22px; margin:40px 0 12px; }
.lede{ color:var(--muted); margin:0 0 28px; max-width:34em; }
fieldset{ border:0; padding:0; margin:0 0 22px; min-width:0; }
legend{ font-weight:700; font-size:17px; margin-bottom:8px; padding:0; }
.seg{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:8px; }
.seg button{ min-height:58px; font:inherit; font-size:17px; border-radius:14px; border:2px solid var(--grid-strong);
  background:var(--field); color:var(--ink); cursor:pointer; padding:8px 6px; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); font-weight:700; }
.seg button:disabled{ opacity:.38; cursor:not-allowed; }
.note{ font-size:15px; color:var(--muted); margin:8px 0 0; }
.howto{ background:var(--field); border-left:5px solid var(--ink); padding:14px 16px; border-radius:0 12px 12px 0; margin:6px 0 24px; }
.howto strong{ display:block; margin-bottom:4px; }
button{ -webkit-tap-highlight-color:transparent; }
.primary{ width:100%; min-height:66px; font:inherit; font-size:21px; font-weight:700; border:0; border-radius:16px;
  background:var(--pen); color:#fff; cursor:pointer; }
.secondary{ width:100%; min-height:58px; font:inherit; font-size:18px; border-radius:16px; border:2px solid var(--grid-strong);
  background:transparent; color:var(--ink); cursor:pointer; }
button:focus-visible{ outline:3px solid var(--pen); outline-offset:3px; }
.stack{ display:grid; gap:10px; margin-top:24px; }
.error{ background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:14px 16px; margin:0 0 20px; }
.warn{ background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:12px 16px; margin:16px 0 0; font-size:16px; }
.warn p{ margin:0; } .warn p + p{ margin-top:8px; }

/* recording */
.rec-status{ font-size:20px; font-weight:700; margin:8px 0 4px; min-height:1.5em; }
.count{ font-size:112px; font-weight:700; line-height:1; margin:8px 0 16px; font-variant-numeric:tabular-nums; }
.chart{ width:100%; display:block; border-radius:12px; background:var(--field); }
.strip{ height:200px; }
.camview{ width:100%; max-height:46vh; object-fit:contain; border-radius:12px; background:#000; display:block; margin:0 0 12px; }

/* result */
.res-head{ font-size:20px; font-weight:700; margin:0; }
.res-freq{ font-size:88px; line-height:1; font-weight:700; margin:6px 0 4px; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.res-freq small{ font-size:32px; font-weight:400; letter-spacing:0; margin-left:6px; }
.res-freq.faint{ color:var(--muted); }
.res-sub{ color:var(--muted); margin:0 0 18px; }
.spectrum{ height:210px; }
.details{ margin:18px 0 0; display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:16px; }
.details dt{ color:var(--muted); }
.details dd{ margin:0; }

/* history */
.hist{ list-style:none; margin:0; padding:0; }
.hist li{ padding:12px 0; border-top:1px solid var(--grid); }
.hist .when{ font-size:14px; color:var(--muted); }
.hist .what{ font-weight:700; }
.hist .how{ font-size:15px; color:var(--muted); }
.link{ font:inherit; font-size:15px; background:none; border:0; color:var(--muted); text-decoration:underline; padding:10px 0; cursor:pointer; }
.disclaimer{ font-size:14px; color:var(--muted); margin-top:40px; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<main>
  <section id="setup">
    <h1>Tremor meter</h1>
    <p class="lede">Measures how fast a hand or leg shakes, from your phone's motion sensor or its camera.</p>
    <div id="setupError" class="error" role="alert" hidden></div>

    <fieldset>
      <legend>Measure with</legend>
      <div class="seg" data-key="sensor">
        <button type="button" data-v="motion">Motion sensor</button>
        <button type="button" data-v="camera">Camera</button>
      </div>
      <p class="note" id="sensorNote"></p>
    </fieldset>
    <fieldset>
      <legend>Body part</legend>
      <div class="seg" data-key="limb">
        <button type="button" data-v="hand">Hand</button>
        <button type="button" data-v="leg">Leg</button>
      </div>
    </fieldset>
    <fieldset>
      <legend>Position</legend>
      <div class="seg" data-key="posture">
        <button type="button" data-v="rest">At rest</button>
        <button type="button" data-v="hold">Held out</button>
        <button type="button" data-v="stand">Standing</button>
      </div>
    </fieldset>

    <div class="howto" id="howto"></div>
    <button class="primary" id="startBtn" type="button">Start measuring</button>
  </section>

  <section id="record" hidden aria-live="polite">
    <p class="rec-status" id="recStatus">Get ready</p>
    <div class="count" id="count"></div>
    <canvas class="camview" id="camView" hidden aria-label="Camera view with hand points"></canvas>
    <canvas class="chart strip" id="strip" aria-label="Live movement trace"></canvas>
    <p class="note" id="recNote"></p>
    <div class="stack"><button class="secondary" id="cancelBtn" type="button">Cancel</button></div>
  </section>

  <section id="result" hidden>
    <p class="res-head" id="resHead"></p>
    <p class="res-freq" id="resFreq"></p>
    <p class="res-sub" id="resSub"></p>
    <canvas class="chart spectrum" id="spectrum" aria-label="Frequency spectrum of the movement"></canvas>
    <dl class="details" id="resDetails"></dl>
    <div class="warn" id="resWarn" hidden></div>
    <div class="stack">
      <button class="primary" id="againBtn" type="button">Measure again</button>
      <button class="secondary" id="setupBtn" type="button">Change setup</button>
    </div>
  </section>

  <section id="historyWrap" hidden>
    <h2>Past measurements</h2>
    <ol class="hist" id="histList"></ol>
    <button class="link" id="clearHist" type="button">Clear history</button>
  </section>

  <p class="disclaimer">Not a medical device. The numbers are for comparing the same person over time with the same setup, not for diagnosis.</p>
</main>

<script>
/* ============================================================
   TUNING CONSTANTS
   ============================================================ */
const CONFIG = {
  COUNTDOWN_S: { motion: 5, camera: 3 }, // time to strap the phone on / get the hand in frame
  RECORD_S: 20,
  START_DELAY_MS: 350,   // skip the moment of the start beep
  BAND_LO: 3,            // Hz: slower movement than this is posture drift, not tremor
  BAND_HI: 20,           // Hz: upper end of the search (capped by what the sample rate can see)
  SEG_S: 4,              // Welch segment length in seconds (sets frequency resolution)
  STRONG_RATIO: 8,       // peak power / median power in the band for "clear rhythm"
  WEAK_RATIO: 3,         // ...for "weak rhythm"
  PALM_MM: 85,           // assumed wrist-to-knuckle length, converts camera pixels to mm
  MP_VERSION: '0.10.35',
  MODEL_URL: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
};

const $ = (id) => document.getElementById(id);
const state = { sensor: 'motion', limb: 'hand', posture: 'rest' };
const LABEL = {
  sensor: { motion: 'motion sensor', camera: 'camera' },
  limb: { hand: 'Hand', leg: 'Leg' },
  posture: { rest: 'at rest', hold: 'held out', stand: 'standing' },
};
const HOWTO = {
  'motion-hand-rest': ['Hold the phone loosely in your hand.', 'Rest your forearm on your thigh or a table and relax completely. Don\'t try to hold still.'],
  'motion-hand-hold': ['Hold the phone in your hand.', 'Stretch your arm straight out in front of you, palm down, and keep it there.'],
  'motion-leg-rest': ['Sit down and put the phone in your sock or strap it to your shin.', 'Feet flat on the floor, leg fully relaxed.'],
  'motion-leg-hold': ['Sit down with the phone in your sock or strapped to your shin.', 'Lift the leg straight out and hold it there.'],
  'motion-leg-stand': ['Put the phone in your sock or strap it to your shin.', 'Stand still with your feet together. Hold on to something if you need to.'],
  'camera-hand-rest': ['Stand the phone up facing you, about 40 cm away.', 'Rest your forearm on the table with the hand relaxed, fingers spread, the whole hand in view.'],
  'camera-hand-hold': ['Stand the phone up facing you, about 50 cm away.', 'Stretch your arm toward the camera, palm facing it, fingers spread, the whole hand in view.'],
};

/* ---------------- setup screen ---------------- */
function renderSetup() {
  if (state.sensor === 'camera') state.limb = 'hand';
  if (state.limb === 'hand' && state.posture === 'stand') state.posture = 'rest';
  document.querySelectorAll('.seg').forEach((seg) => {
    const key = seg.dataset.key;
    seg.querySelectorAll('button').forEach((b) => {
      b.setAttribute('aria-pressed', String(state[key] === b.dataset.v));
      b.disabled = (key === 'limb' && b.dataset.v === 'leg' && state.sensor === 'camera') ||
                   (key === 'posture' && b.dataset.v === 'stand' && state.limb === 'hand');
    });
  });
  $('sensorNote').textContent = state.sensor === 'camera'
    ? 'Camera works for the hand only. It sees up to about 10\u201315 shakes per second.'
    : 'Most accurate. Sees fast shaking too.';
  const [a, b] = HOWTO[state.sensor + '-' + state.limb + '-' + state.posture];
  $('howto').innerHTML = '';
  const s = document.createElement('strong'); s.textContent = a;
  const p = document.createElement('span'); p.textContent = b + ' Tap start, then get into position during the countdown. You\'ll hear a beep when recording starts and when it ends.';
  $('howto').append(s, p);
}
document.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  state[seg.dataset.key] = b.dataset.v; renderSetup();
}));
function show(id) {
  for (const s of ['setup', 'record', 'result']) $(s).hidden = s !== id;
  $('historyWrap').hidden = id === 'record' || !loadHistory().length;
  window.scrollTo(0, 0);
}
function setupError(msg) { rec = null; show('setup'); $('setupError').textContent = msg; $('setupError').hidden = !msg; }

/* ---------------- sound ---------------- */
let actx = null;
function beep(freq, ms, vol = 0.25) {
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + ms / 1000);
    o.start(t); o.stop(t + ms / 1000 + 0.02);
  } catch {}
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------------- recording ---------------- */
let rec = null, wakeLock = null;

function onMotion(e) {
  if (!rec || rec.sensor !== 'motion') return;
  const a = e.acceleration && e.acceleration.x != null ? e.acceleration : null;
  const g = !a && e.accelerationIncludingGravity && e.accelerationIncludingGravity.x != null ? e.accelerationIncludingGravity : null;
  const v = a || g; if (!v) return;
  const t = e.timeStamp > 0 ? e.timeStamp : performance.now();
  addMotion(t, v.x || 0, v.y || 0, v.z || 0, !!g);
}
function addMotion(t, x, y, z, gravity) {
  rec.seen++; rec.lastEventAt = performance.now();
  if (rec.phase !== 'rec' || t < rec.startAt || t > rec.endAt) return;
  if (gravity) rec.usedGravity = true;
  rec.samples.push({ t, v: [x, y, z] });
  const m = Math.hypot(x, y, z);
  rec.ema = rec.ema === null ? m : rec.ema + 0.05 * (m - rec.ema);
  rec.live.push({ t, y: m - rec.ema });
}

async function start() {
  if (rec) return; // already running
  $('setupError').hidden = true;
  // iOS asks for motion permission; it must be requested straight from the tap.
  if (state.sensor === 'motion' && typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    try { if ((await DeviceMotionEvent.requestPermission()) !== 'granted') return setupError('Motion access was denied. Allow motion access for this site and try again.'); }
    catch (e) { return setupError('Motion access could not be requested: ' + (e.message || e)); }
  }
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {}
  const id = Date.now();
  rec = { id, sensor: state.sensor, limb: state.limb, posture: state.posture, phase: 'prep', samples: [], live: [], ema: null,
          seen: 0, lastEventAt: 0, usedGravity: false, frames: 0, missed: 0, palm: [], startAt: Infinity, endAt: Infinity };
  show('record');
  $('count').textContent = ''; $('recNote').textContent = '';
  $('camView').hidden = rec.sensor !== 'camera';
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}

  if (rec.sensor === 'camera') {
    $('recStatus').textContent = 'Starting camera and hand tracker\u2026';
    try { await startCamera(); await getLandmarker(); }
    catch (e) { console.error('[tremor] camera', e); stopAll(); return setupError(explainCamera(e)); }
    if (!rec || rec.id !== id) return;
    requestAnimationFrame(camLoop);
  } else {
    window.addEventListener('devicemotion', onMotion);
  }

  const n = CONFIG.COUNTDOWN_S[rec.sensor];
  for (let i = n; i > 0; i--) {
    if (!rec || rec.id !== id) return;
    $('recStatus').textContent = rec.sensor === 'camera' ? 'Get your hand into view' : 'Get into position';
    $('count').textContent = i; beep(660, 90, 0.18);
    await sleep(1000);
  }
  if (!rec || rec.id !== id) return;
  if (rec.sensor === 'motion' && rec.seen === 0) {
    await sleep(800);
    if (!rec || rec.id !== id) return;
    if (rec.seen === 0) { stopAll(); return setupError('No motion data is coming from this device. Some browsers block the motion sensor: in Brave, turn Shields off for this site, or open the page in Chrome. Computers usually have no motion sensor at all.'); }
  }
  beep(1040, 260);
  rec.startAt = performance.now() + CONFIG.START_DELAY_MS;
  rec.endAt = rec.startAt + CONFIG.RECORD_S * 1000;
  rec.phase = 'rec';
  $('count').textContent = ''; $('recStatus').textContent = 'Recording. Stay in position.';
  drawStrip();
  await sleep(CONFIG.RECORD_S * 1000 + CONFIG.START_DELAY_MS + 60);
  if (!rec || rec.id !== id) return;
  finish();
}

function stopAll() {
  window.removeEventListener('devicemotion', onMotion);
  stopCamera();
  try { wakeLock && wakeLock.release(); } catch {} wakeLock = null;
}
function cancel() { stopAll(); rec = null; show('setup'); }

function finish() {
  const r = rec; r.phase = 'done'; stopAll();
  beep(520, 320); try { navigator.vibrate && navigator.vibrate(200); } catch {}
  let samples = r.samples, unit;
  if (r.sensor === 'camera') {
    const palm = median(r.palm) || 1, k = CONFIG.PALM_MM / palm;
    samples = samples.map((s) => ({ t: s.t, v: s.v.map((x) => x * k) }));
    unit = 'mm';
  } else unit = 'accel';
  const res = analyze(samples, { unit, ampChannels: r.sensor === 'camera' ? [0, 1] : [0, 1, 2] });
  res.sensor = r.sensor; res.limb = r.limb; res.posture = r.posture;
  res.plannedS = CONFIG.RECORD_S;
  if (r.sensor === 'camera') { res.handPct = r.frames ? 1 - r.missed / r.frames : 0; res.delegate = trackerDelegate; }
  lastResult = res;
  if (!res.error) saveHistory(res);
  renderResult(res);
  rec = null;
}

/* ---------------- camera ---------------- */
const video = document.createElement('video');
video.muted = true; video.playsInline = true; video.setAttribute('playsinline', '');
const frameCanvas = document.createElement('canvas'), fctx = frameCanvas.getContext('2d', { willReadFrequently: true });
let stream = null, landmarker = null, landmarkerP = null, trackerDelegate = '-', lastVideoTime = -1, lastLm = null;

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('Camera API unavailable'), { name: 'NoMediaDevices' });
  stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } } });
  video.srcObject = stream; await video.play().catch(() => {});
  if (video.readyState < 2) await new Promise((r) => video.addEventListener('loadeddata', r, { once: true }));
}
function stopCamera() { if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; lastVideoTime = -1; lastLm = null; }
function getLandmarker() {
  if (landmarker) return Promise.resolve(landmarker);
  if (!landmarkerP) landmarkerP = (async () => {
    const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + CONFIG.MP_VERSION;
    const vision = await import(base + '/vision_bundle.mjs');
    const fileset = await vision.FilesetResolver.forVisionTasks(base + '/wasm');
    // Phones use the CPU tracker: on some Android GPUs the GPU tracker never finds a hand.
    const first = matchMedia('(pointer: coarse)').matches ? 'CPU' : 'GPU';
    const make = (d) => vision.HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: CONFIG.MODEL_URL, delegate: d }, runningMode: 'VIDEO', numHands: 1,
      minHandDetectionConfidence: 0.3, minHandPresenceConfidence: 0.3, minTrackingConfidence: 0.5 });
    try { landmarker = await make(first); trackerDelegate = first; }
    catch (e) { const other = first === 'GPU' ? 'CPU' : 'GPU'; landmarker = await make(other); trackerDelegate = other; }
    return landmarker;
  })().catch((e) => { landmarkerP = null; throw e; });
  return landmarkerP;
}
function explainCamera(e) {
  const n = e && e.name, m = String((e && e.message) || e);
  if (n === 'NotAllowedError' || n === 'SecurityError') return 'Camera permission was denied. Allow the camera for this site and try again.';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'No usable camera was found on this device.';
  if (n === 'NotReadableError') return 'The camera is busy in another app. Close it and try again.';
  if (n === 'NoMediaDevices') return 'This browser can\'t use the camera here. The page must be opened over https.';
  return 'The hand tracker could not start (' + m + '). Check your connection and try again.';
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function camLoop() {
  if (!rec || rec.sensor !== 'camera' || rec.phase === 'done' || !stream) return;
  const now = performance.now();
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const vw = video.videoWidth, vh = video.videoHeight;
    if (vw && vh) {
      if (frameCanvas.width !== vw || frameCanvas.height !== vh) { frameCanvas.width = vw; frameCanvas.height = vh; }
      fctx.drawImage(video, 0, 0, vw, vh);
      let lm = null;
      try { const res = landmarker.detectForVideo(frameCanvas, now); lm = res.landmarks && res.landmarks[0]; }
      catch (err) { console.error('[tremor] detect', err); }
      lastLm = lm || null;
      addCameraFrame(now, lm, vw, vh);
    }
  }
  drawCamView();
  requestAnimationFrame(camLoop);
}
function addCameraFrame(t, lm, vw, vh) {
  const recording = rec.phase === 'rec' && t >= rec.startAt && t <= rec.endAt;
  if (recording) rec.frames++;
  if (!lm || lm.length < 21) { if (recording) rec.missed++; if (rec.phase !== 'done') $('recNote').textContent = 'Hand not found. Keep the whole hand in view.'; return; }
  $('recNote').textContent = '';
  if (!recording) return;
  const P = (i) => ({ x: lm[i].x * vw, y: lm[i].y * vh });
  const tip = P(8), c = [0, 5, 9, 13, 17].map(P);
  const palm = { x: c.reduce((s, p) => s + p.x, 0) / 5, y: c.reduce((s, p) => s + p.y, 0) / 5 };
  rec.palm.push(dist(P(0), P(9)));
  rec.samples.push({ t, v: [tip.x, tip.y, palm.x, palm.y] });
  rec.ema = rec.ema === null ? tip.y : rec.ema + 0.08 * (tip.y - rec.ema);
  rec.live.push({ t, y: tip.y - rec.ema });
}
const LINKS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawCamView() {
  const cv = $('camView'); if (cv.hidden || video.readyState < 2) return;
  const w = 480, h = Math.round(480 * (video.videoHeight || 480) / (video.videoWidth || 640));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const c = cv.getContext('2d');
  c.save(); c.translate(w, 0); c.scale(-1, 1); c.drawImage(video, 0, 0, w, h); c.restore();
  if (!lastLm) return;
  const P = (i) => [(1 - lastLm[i].x) * w, lastLm[i].y * h];
  c.strokeStyle = '#ff6f62'; c.lineWidth = 2; c.beginPath();
  for (const [a, b] of LINKS) { const pa = P(a), pb = P(b); c.moveTo(pa[0], pa[1]); c.lineTo(pb[0], pb[1]); }
  c.stroke();
  const tp = P(8); c.fillStyle = '#fff'; c.beginPath(); c.arc(tp[0], tp[1], 5, 0, Math.PI * 2); c.fill();
}

/* ---------------- live strip chart ---------------- */
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function sizeCanvas(cv) {
  const dpr = Math.min(2, window.devicePixelRatio || 1), r = cv.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { c, w: r.width, h: r.height };
}
function paperGrid(c, w, h, xStep, yStep) {
  c.fillStyle = cssVar('--field'); c.fillRect(0, 0, w, h);
  c.strokeStyle = cssVar('--grid'); c.lineWidth = 1; c.beginPath();
  for (let x = 0; x <= w; x += xStep) { c.moveTo(Math.round(x) + 0.5, 0); c.lineTo(Math.round(x) + 0.5, h); }
  for (let y = 0; y <= h; y += yStep) { c.moveTo(0, Math.round(y) + 0.5); c.lineTo(w, Math.round(y) + 0.5); }
  c.stroke();
}
function drawStrip() {
  if (!rec || rec.phase !== 'rec') return;
  const { c, w, h } = sizeCanvas($('strip'));
  paperGrid(c, w, h, w / CONFIG.RECORD_S, h / 8);
  const now = performance.now(), T = CONFIG.RECORD_S * 1000;
  const pts = rec.live;
  let peak = 1e-9; for (let i = Math.max(0, pts.length - 400); i < pts.length; i++) peak = Math.max(peak, Math.abs(pts[i].y));
  const scale = (h * 0.42) / peak;
  c.strokeStyle = cssVar('--ink'); c.lineWidth = 1.6; c.lineJoin = 'round'; c.beginPath();
  pts.forEach((p, i) => { const x = (p.t - rec.startAt) / T * w, y = h / 2 - p.y * scale; i ? c.lineTo(x, y) : c.moveTo(x, y); });
  c.stroke();
  const px = Math.min(w, Math.max(0, (now - rec.startAt) / T * w));
  c.strokeStyle = cssVar('--pen'); c.lineWidth = 2; c.beginPath(); c.moveTo(px, 0); c.lineTo(px, h); c.stroke();
  const left = Math.max(0, Math.ceil((rec.endAt - now) / 1000));
  $('count').textContent = left > 0 ? left : '';
  requestAnimationFrame(drawStrip);
}

/* ---------------- analysis ---------------- */
function median(a) { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function nextPow2(n) { let p = 1; while (p < n) p <<= 1; return p; }
function prevPow2(n) { let p = 1; while (p * 2 <= n) p <<= 1; return p; }
// Linear interpolation of irregular samples onto an even time grid.
function resample(samples, fs) {
  const t0 = samples[0].t, t1 = samples[samples.length - 1].t;
  const m = Math.floor((t1 - t0) / 1000 * fs) + 1, C = samples[0].v.length;
  const out = Array.from({ length: C }, () => new Float64Array(m));
  let j = 0;
  for (let i = 0; i < m; i++) {
    const t = t0 + i * 1000 / fs;
    while (j < samples.length - 2 && samples[j + 1].t < t) j++;
    const a = samples[j], b = samples[j + 1] || a, span = b.t - a.t || 1, u = Math.min(1, Math.max(0, (t - a.t) / span));
    for (let c = 0; c < C; c++) out[c][i] = a.v[c] + (b.v[c] - a.v[c]) * u;
  }
  return out;
}
function detrend(x) {
  const n = x.length; let sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (let i = 0; i < n; i++) { sx += i; sy += x[i]; sxx += i * i; sxy += i * x[i]; }
  const b = (n * sxy - sx * sy) / ((n * sxx - sx * sx) || 1), a = (sy - b * sx) / n;
  const y = new Float64Array(n); for (let i = 0; i < n; i++) y[i] = x[i] - (a + b * i); return y;
}
function fft(re, im) { // in-place radix-2
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const a = i + k, b = a + len / 2;
        const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        const ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;
      }
    }
  }
}
// One-sided power spectral density (units^2 / Hz), Hann window, 50% overlap.
function welch(x, fs, nfft) {
  const w = new Float64Array(nfft); let wss = 0;
  for (let i = 0; i < nfft; i++) { w[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (nfft - 1)); wss += w[i] * w[i]; }
  const starts = []; for (let s = 0; s + nfft <= x.length; s += nfft / 2) starts.push(s);
  if (!starts.length) starts.push(0);
  const out = new Float64Array(nfft / 2 + 1), re = new Float64Array(nfft), im = new Float64Array(nfft);
  for (const s of starts) {
    let mean = 0, cnt = 0; for (let i = 0; i < nfft && s + i < x.length; i++) { mean += x[s + i]; cnt++; } mean /= cnt || 1;
    for (let i = 0; i < nfft; i++) { re[i] = s + i < x.length ? (x[s + i] - mean) * w[i] : 0; im[i] = 0; }
    fft(re, im);
    for (let k = 0; k <= nfft / 2; k++) out[k] += (k === 0 || k === nfft / 2 ? 1 : 2) * (re[k] * re[k] + im[k] * im[k]) / (fs * wss);
  }
  for (let k = 0; k < out.length; k++) out[k] /= starts.length;
  return out;
}
// samples: [{t: ms, v: [channels]}]. unit: 'accel' (m/s^2) or 'mm' (displacement).
function analyze(samples, { unit = 'accel', ampChannels = null } = {}) {
  if (samples.length < 32) return { error: 'Too few samples were recorded (' + samples.length + ').' };
  const n = samples.length, dur = (samples[n - 1].t - samples[0].t) / 1000;
  if (dur < 3) return { error: 'The recording was too short.' };
  const fs = (n - 1) / dur, nyq = fs / 2;
  const chans = resample(samples, fs).map(detrend);
  const m = chans[0].length;
  const nfft = Math.max(32, Math.min(nextPow2(Math.round(fs * CONFIG.SEG_S)), prevPow2(m)));
  const df = fs / nfft;
  const psds = chans.map((x) => welch(x, fs, nfft));
  const K = nfft / 2 + 1, all = new Float64Array(K), amp = new Float64Array(K);
  const ampIdx = ampChannels || psds.map((_, i) => i);
  psds.forEach((p, c) => { for (let k = 0; k < K; k++) { all[k] += p[k]; if (ampIdx.includes(c)) amp[k] += p[k]; } });
  const lo = CONFIG.BAND_LO, hi = Math.min(CONFIG.BAND_HI, nyq - 0.5);
  if (hi <= lo + 1) return { error: 'The sample rate (' + fs.toFixed(0) + ' per second) is too low to measure shaking.', fs, nyq, dur };
  const kLo = Math.ceil(lo / df), kHi = Math.floor(hi / df);
  let kp = kLo; for (let k = kLo; k <= kHi; k++) if (all[k] > all[kp]) kp = k;
  let f0 = kp * df; // parabolic refinement of the peak
  if (kp > kLo && kp < kHi) {
    const a = all[kp - 1], b = all[kp], c = all[kp + 1], d = a - 2 * b + c;
    if (d < 0) f0 = (kp + 0.5 * (a - c) / d) * df;
  }
  const band = Array.from(all.slice(kLo, kHi + 1));
  const ratio = all[kp] / (median(band) || 1e-12);
  const strength = ratio >= CONFIG.STRONG_RATIO ? 'clear' : ratio >= CONFIG.WEAK_RATIO ? 'weak' : 'none';
  let pw = 0; for (let k = Math.max(0, Math.round((f0 - 1) / df)); k <= Math.min(K - 1, Math.round((f0 + 1) / df)); k++) pw += amp[k] * df;
  const rms = Math.sqrt(pw);
  const pp = unit === 'accel' ? 2 * Math.SQRT2 * rms / Math.pow(2 * Math.PI * f0, 2) * 1000 : 2 * Math.SQRT2 * rms; // mm, peak to peak
  const freqs = Array.from({ length: K }, (_, k) => k * df);
  const edge = kp === kLo || kp === kHi;
  // trace for display: strongest channel, detrended
  let best = 0, bv = -1; chans.forEach((x, i) => { let v = 0; for (const s of x) v += s * s; if (v > bv) { bv = v; best = i; } });
  return { fs, nyq, dur, n, f0, ratio, strength, rms, pp, unit, freqs, psd: Array.from(all), band: [lo, hi], edge, trace: Array.from(chans[best]) };
}

/* ---------------- result ---------------- */
function fmtMM(x) { return x >= 10 ? x.toFixed(0) : x >= 1 ? x.toFixed(1) : x >= 0.1 ? x.toFixed(2) : x.toFixed(3); }
function renderResult(res) {
  show('result');
  const sub = LABEL.limb[res.limb] + ', ' + LABEL.posture[res.posture] + ', ' + LABEL.sensor[res.sensor];
  $('resSub').textContent = sub;
  const dl = $('resDetails'); dl.innerHTML = '';
  const row = (k, v) => { const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = k; dd.textContent = v; dl.append(dt, dd); };
  const warns = [];
  if (res.error) {
    $('resHead').textContent = 'No result';
    $('resFreq').textContent = '\u2013'; $('resFreq').className = 'res-freq faint';
    warns.push(res.error);
    $('spectrum').hidden = true;
  } else {
    $('spectrum').hidden = false;
    $('resHead').textContent = res.strength === 'clear' ? 'Clear rhythm' : res.strength === 'weak' ? 'Weak rhythm' : 'No clear rhythm';
    $('resFreq').innerHTML = '';
    $('resFreq').append(document.createTextNode(res.f0.toFixed(1)));
    const sm = document.createElement('small'); sm.textContent = 'Hz'; $('resFreq').append(sm);
    $('resFreq').className = 'res-freq' + (res.strength === 'none' ? ' faint' : '');
    if (res.strength === 'none') $('resHead').textContent = 'No clear rhythm. Strongest at';
    row('Shakes per second', res.f0.toFixed(1) + ' (Hz)');
    row('Size', '\u2248 ' + fmtMM(res.pp) + ' mm back and forth' + (res.sensor === 'camera' ? ', at the fingertip' : ''));
    if (res.sensor === 'motion') row('Acceleration', res.rms.toFixed(3) + ' m/s\u00b2 (RMS)');
    row('Rhythm strength', (res.ratio > 100 ? 'over 100' : res.ratio.toFixed(1)) + '\u00d7 the background');
    row('Sample rate', res.fs.toFixed(0) + ' per second, sees up to ' + res.nyq.toFixed(0) + ' Hz');
    row('Recorded', res.dur.toFixed(1) + ' s, ' + res.n + ' samples');
    if (res.sensor === 'camera') row('Hand tracker', (res.delegate || '-') + ', hand found in ' + Math.round((res.handPct || 0) * 100) + '% of frames');
    if (res.posture === 'stand' && res.nyq < 18) warns.push('This device only gave ' + res.fs.toFixed(0) + ' samples per second, which is too slow to see fast shaking while standing (13\u201318 Hz).');
    else if (res.nyq < 12) warns.push('Low sample rate: shaking faster than ' + res.nyq.toFixed(0) + ' Hz is invisible and can show up at a wrong, lower frequency.');
    if (res.strength !== 'none' && res.pp < 0.1) warns.push('The movement is very small. Everyone\'s hands and legs have a tiny, fast natural shake (often around 8\u201312 Hz), and a clear rhythm this small can be just that.');
    if (res.edge && res.strength !== 'none') warns.push('The peak is at the edge of the measurable range, so the real rhythm may be outside it.');
    if (res.sensor === 'camera' && res.handPct < 0.8) warns.push('The hand was lost in ' + Math.round((1 - res.handPct) * 100) + '% of frames. Keep the whole hand in view and try again.');
    if (res.dur < res.plannedS * 0.8) warns.push('The recording was shorter than planned (' + res.dur.toFixed(1) + ' s). Keep the screen on.');
    requestAnimationFrame(() => drawSpectrum(res));
  }
  $('resWarn').innerHTML = '';
  warns.forEach((w) => { const p = document.createElement('p'); p.textContent = w; $('resWarn').append(p); });
  $('resWarn').hidden = !warns.length;
  renderHistory();
}
function drawSpectrum(res) {
  const { c, w, h } = sizeCanvas($('spectrum'));
  const xmax = Math.min(25, res.nyq), pad = { l: 8, r: 8, t: 14, b: 26 };
  const X = (f) => pad.l + f / xmax * (w - pad.l - pad.r), plotH = h - pad.t - pad.b;
  paperGrid(c, w, h, 1e9, 1e9);
  c.strokeStyle = cssVar('--grid'); c.lineWidth = 1; c.beginPath();
  for (let f = 0; f <= xmax; f += 1) { const x = Math.round(X(f)) + 0.5; c.moveTo(x, pad.t); c.lineTo(x, h - pad.b); }
  c.stroke();
  c.fillStyle = cssVar('--muted'); c.font = '13px "Atkinson Hyperlegible", system-ui, sans-serif'; c.textAlign = 'center';
  for (let f = 0; f <= xmax; f += 5) c.fillText(f + ' Hz', Math.min(w - 22, Math.max(18, X(f))), h - 8);
  // outside the search band: shaded
  c.fillStyle = cssVar('--grid'); c.globalAlpha = 0.45;
  c.fillRect(X(0), pad.t, X(res.band[0]) - X(0), plotH);
  if (res.band[1] < xmax) c.fillRect(X(res.band[1]), pad.t, X(xmax) - X(res.band[1]), plotH);
  c.globalAlpha = 1;
  let top = 1e-12; res.freqs.forEach((f, k) => { if (f >= res.band[0] && f <= res.band[1]) top = Math.max(top, res.psd[k]); });
  const Y = (p) => h - pad.b - Math.min(1.05, p / top) * plotH * 0.9;
  c.beginPath(); c.moveTo(X(0), h - pad.b);
  res.freqs.forEach((f, k) => { if (f <= xmax) c.lineTo(X(f), Y(res.psd[k])); });
  c.lineTo(X(Math.min(xmax, res.freqs[res.freqs.length - 1])), h - pad.b); c.closePath();
  c.fillStyle = cssVar('--ink'); c.globalAlpha = 0.14; c.fill(); c.globalAlpha = 1;
  c.beginPath(); res.freqs.forEach((f, k) => { if (f <= xmax) (k ? c.lineTo(X(f), Y(res.psd[k])) : c.moveTo(X(f), Y(res.psd[k]))); });
  c.strokeStyle = cssVar('--ink'); c.lineWidth = 1.8; c.stroke();
  const px = X(res.f0);
  c.strokeStyle = cssVar('--pen'); c.lineWidth = 2; c.setLineDash([5, 4]); c.beginPath(); c.moveTo(px, pad.t); c.lineTo(px, h - pad.b); c.stroke(); c.setLineDash([]);
  c.fillStyle = cssVar('--pen'); c.textAlign = px > w - 70 ? 'right' : 'left'; c.font = '700 14px "Atkinson Hyperlegible", system-ui, sans-serif';
  c.fillText(res.f0.toFixed(1) + ' Hz', px + (px > w - 70 ? -6 : 6), pad.t + 4);
}

/* ---------------- history ---------------- */
const HKEY = 'tremor.history.v1';
function loadHistory() { try { return JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch { return []; } }
function saveHistory(res) {
  const h = loadHistory();
  h.unshift({ ts: Date.now(), sensor: res.sensor, limb: res.limb, posture: res.posture, f: +res.f0.toFixed(2), strength: res.strength, pp: +res.pp.toPrecision(3), fs: Math.round(res.fs) });
  try { localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 50))); } catch {}
}
function renderHistory() {
  const h = loadHistory(), ol = $('histList'); ol.innerHTML = '';
  $('historyWrap').hidden = !h.length || !$('record').hidden;
  const fmt = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  for (const e of h.slice(0, 20)) {
    const li = document.createElement('li');
    const when = document.createElement('div'); when.className = 'when'; when.textContent = fmt.format(new Date(e.ts));
    const what = document.createElement('div'); what.className = 'what';
    what.textContent = e.f.toFixed(1) + ' Hz, ' + (e.strength === 'clear' ? 'clear rhythm' : e.strength === 'weak' ? 'weak rhythm' : 'no clear rhythm');
    const how = document.createElement('div'); how.className = 'how';
    how.textContent = LABEL.limb[e.limb] + ' ' + LABEL.posture[e.posture] + ', ' + LABEL.sensor[e.sensor] + ', \u2248 ' + fmtMM(e.pp) + ' mm';
    li.append(when, what, how); ol.append(li);
  }
}

/* ---------------- wiring ---------------- */
let lastResult = null;
$('startBtn').addEventListener('click', start);
$('cancelBtn').addEventListener('click', cancel);
$('againBtn').addEventListener('click', start);
$('setupBtn').addEventListener('click', () => { show('setup'); renderHistory(); });
$('clearHist').addEventListener('click', () => { try { localStorage.removeItem(HKEY); } catch {} renderHistory(); });
window.addEventListener('resize', () => { if (!$('result').hidden && lastResult && !lastResult.error) drawSpectrum(lastResult); });
renderSetup();
renderHistory();

// Test hook: lets automated tests feed samples and run the analysis without real sensors.
window.__tremor = { CONFIG, state, analyze, addMotion, get rec() { return rec; }, get last() { return lastResult; } };
</script>
